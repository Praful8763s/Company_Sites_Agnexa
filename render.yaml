services:
  - type: web
    name: agnexa-technologies-fullstack
    env: node
    plan: free
    region: oregon
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: node server/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

